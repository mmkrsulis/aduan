<div class="table-wrap"><table><thead><tr><th>{{tr('Case')}}</th><th>{{tr('Citizen / Customer')}}</th><th>{{tr('Category')}}</th><th>{{tr('Priority')}}</th><th>{{tr('Status')}}</th><th></th></tr></thead><tbody>{% for t in tickets %}<tr><td><b>{{t.code}}</b><small>{{t.subject|truncate(35)}}</small></td><td>{{t.contact}}<small>{{t.phone}}</small></td><td>{{t.category}}</td><td><span class="priority {{t.priority}}">{{tr(t.priority)}}</span></td><td><span class="badge {{t.status}}">{{tr(t.status|replace('_',' '))}}</span></td><td><a class="iconbtn small" href="{{url_for('ticket',tid=t.id)}}">→</a></td></tr>{% else %}<tr><td colspan="6" class="empty">{{tr('No complaints found.')}}</td></tr>{% endfor %}</tbody></table></div>
