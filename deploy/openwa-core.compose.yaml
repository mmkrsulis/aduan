services:
  openwa-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: openwa-rmynd:0.23.3-local
    container_name: openwa-core
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 2048
    mem_limit: 2g
    ports:
      - 127.0.0.1:18084:2785
    environment:
      NODE_ENV: production
      PORT: 2785
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      LOG_LEVEL: info
      AUTO_START_SESSIONS: "true"
      DATABASE_TYPE: sqlite
      DATABASE_NAME: /app/data/openwa.sqlite
      DATABASE_SYNCHRONIZE: "true"
      ENGINE_TYPE: baileys
      RESOLVE_LID_TO_PHONE: "true"
      SESSION_DATA_PATH: /app/data/sessions
      PUPPETEER_HEADLESS: "true"
      PUPPETEER_ARGS: --no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      REDIS_ENABLED: "false"
      QUEUE_ENABLED: "false"
      CACHE_ENABLED: "false"
      SERVE_DASHBOARD: "false"
      ENABLE_SWAGGER: "false"
      API_MASTER_KEY: ${WEBHOOK_SECRET}
      SSRF_ALLOWED_HOSTS: aduan-hub
      WEBHOOK_TIMEOUT: 10000
      WEBHOOK_RETRY_DELAY: 5000
    volumes:
      - openwa_core_data:/app/data
    networks:
      - aduan_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2785/api/infra/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  openwa_core_data:

networks:
  aduan_net:
    external: true
    name: aduan-hub-net
