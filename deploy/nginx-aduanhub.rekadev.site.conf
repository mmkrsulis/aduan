limit_req_zone $binary_remote_addr zone=aduanhub_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=aduanhub_webhook:10m rate=60r/m;
server {
    listen 80;
    server_name aduanhub.rekadev.site;
    location ^~ /.well-known/acme-challenge/ { root /var/www/rekadev-acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name aduanhub.rekadev.site;
    ssl_certificate /etc/letsencrypt/live/aduanhub.rekadev.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aduanhub.rekadev.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AduanHubTLS:10m;
    ssl_session_tickets off;
    access_log /var/log/nginx/aduanhub.rekadev.site.access.log;
    error_log /var/log/nginx/aduanhub.rekadev.site.error.log warn;
    client_max_body_size 8m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    location = /login { limit_req zone=aduanhub_login burst=10 nodelay; proxy_pass http://127.0.0.1:18083; include proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /webhooks/ { limit_req zone=aduanhub_webhook burst=30 nodelay; proxy_pass http://127.0.0.1:18083; include proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://127.0.0.1:18083; include proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /static/ { proxy_pass http://127.0.0.1:18083; include proxy_params; proxy_set_header X-Forwarded-Proto $scheme; expires 7d; add_header Cache-Control "public, max-age=604800, immutable"; }
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
