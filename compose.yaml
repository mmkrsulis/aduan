services:
  aduan-hub:
    build: .
    container_name: aduan-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:18083:8080"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DATABASE_PATH: /data/aduan.db
      MPWA_BASE_URL: ${MPWA_BASE_URL:-http://host.docker.internal:18082}
      MPWA_API_KEY: ${MPWA_API_KEY:-}
      MPWA_SENDER: ${MPWA_SENDER:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-ChangeMeBeforeLaunch!}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - aduan_data:/data
    networks:
      - aduan_net
volumes:
  aduan_data:
networks:
  aduan_net:
    name: aduan-hub-net
