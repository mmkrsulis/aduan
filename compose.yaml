services:
  aduan-hub:
    build: .
    container_name: aduan-hub
    restart: unless-stopped
    ports:
      - "100.103.199.63:18083:8080"
      - "172.16.31.93:18083:8080"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DATABASE_PATH: /data/aduan.db
      MPWA_BASE_URL: ${MPWA_BASE_URL:-http://host.docker.internal:18082}
      MPWA_API_KEY: ${MPWA_API_KEY:-}
      MPWA_SENDER: ${MPWA_SENDER:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-ChangeMeBeforeLaunch!}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - aduan_data:/data
    networks:
      - aduan_net
  chat-timeout-worker:
    build: .
    container_name: aduan-hub-chat-timeout
    restart: unless-stopped
    healthcheck:
      disable: true
    command: ["python","chat_timeout_worker.py"]
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DATABASE_PATH: /data/aduan.db
      MPWA_BASE_URL: ${MPWA_BASE_URL:-http://host.docker.internal:18082}
      MPWA_API_KEY: ${MPWA_API_KEY:-}
      MPWA_SENDER: ${MPWA_SENDER:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - aduan_data:/data
    networks:
      - aduan_net
    depends_on:
      aduan-hub:
        condition: service_healthy
  email-worker:
    build: .
    container_name: aduan-hub-email
    restart: unless-stopped
    healthcheck:
      disable: true
    command: ["python","email_worker.py"]
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DATABASE_PATH: /data/aduan.db
      EMAIL_POLL_SECONDS: ${EMAIL_POLL_SECONDS:-60}
    volumes:
      - aduan_data:/data
    networks:
      - aduan_net
    depends_on:
      aduan-hub:
        condition: service_healthy
volumes:
  aduan_data:
    external: true
    name: aduan-hub_aduan_data
networks:
  aduan_net:
    name: aduan-hub-net
